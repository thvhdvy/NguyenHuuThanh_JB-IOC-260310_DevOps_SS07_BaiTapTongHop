image: eclipse-temurin:17-jdk

stages:
  - test
  - build

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/caches
    - .gradle/wrapper
  
run_tests:
  stage: test
  services:
    - name: postgres:15-alpine
      alias: postgres
  variables:
    POSTGRES_DB: testdb_ci
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
  before_script:
    - chmod +x gradlew
  script:
    - ./gradlew test

build_project:
  stage: build
  before_script:
    - chmod +x gradlew
  script:
    - ./gradlew assemble
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 7 days